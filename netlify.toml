[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "nft"

# API → Netlify Function (debe ir antes del catch-all)
[[redirects]]
  from = "/api/Conexion.php"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# React Router: cualquier ruta desconocida sirve el index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
